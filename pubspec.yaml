name: sharelan
description: Share files, folders and text between Windows and Android over WiFi.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  file_picker: ">=10.3.0 <11.0.0"
  path_provider: ^2.1.3
  path: ^1.9.0
  archive: ^3.6.1
  open_filex: ^4.5.0
  desktop_drop: ^0.5.0
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

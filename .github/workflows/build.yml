name: Build

on:
  push:
    tags: ["v*"]        # runs when you push a tag like v1.0.0
  workflow_dispatch:     # or run manually from the Actions tab

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --project-name sharelan .
        if: ${{ hashFiles('android/**') == '' }}
      - name: Ensure permissions in AndroidManifest
        shell: bash
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in INTERNET ACCESS_WIFI_STATE CHANGE_WIFI_MULTICAST_STATE MANAGE_EXTERNAL_STORAGE; do
            grep -q "android.permission.$P" "$M" || sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.$P\"\/>\n    <application/" "$M"
          done
          grep -n 'uses-permission' "$M"
      - run: flutter pub get
      - name: Raise old plugins' compileSdk to 36
        shell: bash
        run: |
          C="${PUB_CACHE:-$HOME/.pub-cache}/hosted"
          find "$C" -path '*/android/build.gradle*' -type f | while read -r f; do
            if grep -qE 'compileSdk(Version)?[ =]+(2[0-9]|3[0-5])\b' "$f"; then
              sed -i -E 's/(compileSdk(Version)?[ =]+)(2[0-9]|3[0-5])\b/\136/' "$f"
              echo "patched $f"
            fi
          done
      - name: Build APK (retries if Maven/Gradle downloads are rate-limited)
        shell: bash
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter build apk --release; then ok=1; break; fi
            echo "Build attempt $i failed, retrying in 60s..."
            sleep 60
          done
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: sharelan-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=windows --project-name sharelan .
        if: ${{ hashFiles('windows/**') == '' }}
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sharelan-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sharelan-windows
          path: sharelan-windows.zip
      - name: Build Windows installer (optional)
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\sharelan.iss
      - uses: actions/upload-artifact@v4
        with:
          name: sharelan-windows-installer
          path: installer_out/ShareLAN-Setup.exe
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=ios --project-name sharelan .
        if: ${{ hashFiles('ios/**') == '' }}
      - name: Add iOS Info.plist keys
        shell: bash
        run: |
          PL=ios/Runner/Info.plist
          B=/usr/libexec/PlistBuddy
          set_str() { $B -c "Add :$1 string $2" "$PL" 2>/dev/null || $B -c "Set :$1 $2" "$PL"; }
          set_bool() { $B -c "Add :$1 bool true" "$PL" 2>/dev/null || $B -c "Set :$1 true" "$PL"; }
          set_str NSLocalNetworkUsageDescription "ShareLAN uses your local network to find and send files to your other devices."
          set_str NSPhotoLibraryUsageDescription "ShareLAN lets you pick photos and videos to send."
          set_bool UIFileSharingEnabled
          set_bool LSSupportsOpeningDocumentsInPlace
          $B -c "Print" "$PL" | grep -E "NSLocalNetwork|UIFileSharing|LSSupports|NSPhoto"
      - run: flutter pub get
      - name: Build iOS (unsigned)
        shell: bash
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter build ios --release --no-codesign; then ok=1; break; fi
            echo "Build attempt $i failed, retrying in 60s..."
            sleep 60
          done
          [ "$ok" = 1 ]
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr ShareLAN-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sharelan-ios-unsigned
          path: ShareLAN-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/sharelan-windows.zip
            dist/ShareLAN-Setup.exe
            dist/ShareLAN-unsigned.ipa
